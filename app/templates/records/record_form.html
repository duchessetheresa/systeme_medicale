{% extends 'base.html' %}
{% block title %}Nouveau Compte Rendu{% endblock %}
{% block content %}
<div class="container">
    <h2>Nouveau Compte Rendu</h2>
    
    <div class="card">
        <form method="POST" action="{{ url_for('records.create_compte_rendu', dossier_id=dossier_id) }}">
            <div class="form-group">
                <label for="contenu">Contenu *</label>
                <textarea id="contenu" name="contenu" rows="5" required></textarea>
            </div>
            
            <h3>Traitements Prescrits</h3>
            <div id="treatments-container">
                {% include 'records/treatment_form.html' %}
            </div>
            <button type="button" class="btn btn-outline" onclick="addTreatmentForm()">Ajouter un traitement</button>
            
            <div class="form-actions">
                <a href="{{ url_for('records.dossier_detail', dossier_id=dossier_id) }}" class="btn btn-outline">Annuler</a>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
<script>
function addTreatmentForm() {
    const container = document.getElementById('treatments-container');
    const template = `
        <div class="treatment-form">
            <div class="form-group">
                <label>Description</label>
                <textarea name="traitement_description" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Médicament</label>
                <input type="text" name="traitement_medicament">
            </div>
            <div class="form-group">
                <label>Posologie</label>
                <input type="text" name="traitement_posologie">
            </div>
            <div class="form-group">
                <label>Durée</label>
                <input type="text" name="traitement_duree">
            </div>
            <button type="button" class="btn btn-danger btn-small" onclick="this.parentElement.remove()">Supprimer</button>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', template);
}
</script>
{% endblock %}
