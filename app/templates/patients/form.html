{% extends 'base.html' %}
{% block title %}{{ 'Modifier' if is_edit else 'Nouveau' }} Patient{% endblock %}
{% block content %}
<div class="container">
    <h2>{{ 'Modifier' if is_edit else 'Nouveau' }} Patient</h2>
    
    <div class="card">
        <form method="POST" action="{{ url_for('patients.edit_patient', patient_id=patient.id) if is_edit else url_for('patients.create_patient') }}">
            <div class="form-group">
                <label for="nom">Nom *</label>
                <input type="text" id="nom" name="nom" value="{{ patient.nom if patient else '' }}" required>
            </div>
            <div class="form-group">
                <label for="prenom">Prénom *</label>
                <input type="text" id="prenom" name="prenom" value="{{ patient.prenom if patient else '' }}" required>
            </div>
            <div class="form-group">
                <label for="date_naissance">Date de Naissance *</label>
                <input type="date" id="date_naissance" name="date_naissance" value="{{ patient.date_naissance | datetimeformat('%Y-%m-%d') if patient else '' }}" required>
            </div>
            <div class="form-group">
                <label for="adresse">Adresse</label>
                <textarea id="adresse" name="adresse" rows="2">{{ patient.adresse if patient else '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="donnees_biometriques">Données Biométriques (JSON)</label>
                <textarea id="donnees_biometriques" name="donnees_biometriques" rows="3">{{ patient.donnees_biometriques if patient else '{}' }}</textarea>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('patients.list_patients') }}" class="btn btn-outline">Annuler</a>
                <button type="submit" class="btn btn-primary">{{ 'Mettre à jour' if is_edit else 'Créer' }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
